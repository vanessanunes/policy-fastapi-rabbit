version: "3.8"

services:
  api_seguro:
    container_name: api_seguro
    build: .
    # command: bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 5000 --reload"
    ports:
      - 3813:5000
    networks:
      - default
    depends_on:
      - db_seguro
    links:
      - db_seguro

  db_seguro:
    image: postgres
    restart: always
    container_name: db_seguro
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      # POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      # POSTGRES_HOST: ${POSTGRES_HOST}
    networks:
      - default

  rabbitmq_seguro:
    image: rabbitmq:3-management-alpine
    container_name: "rabbitmq_seguro"
    ports:
      - 5673:5673
      - 15673:15673
    environment:
    - RABBITMQ_DEFAULT_USER=seguro
    - RABBITMQ_DEFAULT_PASS=seguro123
    # volumes:
    #   - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      # - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - default

networks:
  default:
    external: true
    name: policy-networks
