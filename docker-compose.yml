version: "3.9"

services:
  postgres:
    image: postgres
    restart: always
    container_name: db_seguro
    ports:
      - "5432:${POSTGRES_PORT}"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
    networks:
      - default

  rabbitmq_seguro:
    image: rabbitmq:3-management
    container_name: "rabbitmq_seguro"
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    networks:
      - default

networks:
  default:
    external: true
    name: apolicy-networks
